<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HealthBridge Patient Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2032%2032%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%231470D9%22/%3E%3Cpath%20d%3D%22M5%2023c3-9%207-12%2011-12s8%203%2011%2012M4%2023h24%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M16%2014v7M12.5%2017.5h7%22%20fill%3D%22none%22%20stroke%3D%22%239BE3FF%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#17212B;--mute:#5F6C7B;--line:#DCE2E9;--pri:#0B5CAD;--prih:#094A8C;--on:#fff;--side:#0E2A47;--ok:#17803D;--okbg:#E2F4E8;--warn:#9A5B00;--warnbg:#FFF1D6;--bad:#B42318;--badbg:#FDE7E5;--info:#0B5CAD;--infobg:#E1EEFB;--hov:#F0F4F8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B141D;--card:#121E2A;--ink:#E5ECF3;--mute:#8CA0B3;--line:#243445;--pri:#4F9BE8;--prih:#78B3F0;--on:#06121D;--side:#08121B;--ok:#6BD08F;--okbg:#10301D;--warn:#F2C46D;--warnbg:#38290B;--bad:#F59D94;--badbg:#3C1814;--info:#7FB6F4;--infobg:#12304F;--hov:#172636}}
:root[data-theme="dark"]{--bg:#0B141D;--card:#121E2A;--ink:#E5ECF3;--mute:#8CA0B3;--line:#243445;--pri:#4F9BE8;--prih:#78B3F0;--on:#06121D;--side:#08121B;--ok:#6BD08F;--okbg:#10301D;--warn:#F2C46D;--warnbg:#38290B;--bad:#F59D94;--badbg:#3C1814;--info:#7FB6F4;--infobg:#12304F;--hov:#172636}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
aside{grid-row:1/3;background:var(--side);color:#C9D6E4;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:2px 8px 18px}
.logo svg{width:34px;height:34px;fill:none;stroke:none;stroke-width:0}.logo i{width:30px;height:30px;border-radius:7px;background:#fff;display:grid;place-items:center}
aside button{display:flex;align-items:center;gap:11px;border:0;background:none;color:inherit;padding:9px 10px;border-radius:6px;cursor:pointer;font-weight:500;text-align:left;white-space:nowrap}
aside button:hover{background:#ffffff14}
aside button[aria-current=page]{background:#ffffff24;color:#fff;box-shadow:inset 3px 0 0 #6DB4FF}
aside svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sf{margin-top:auto;font-size:12px;color:#8DA2B8;padding:8px}
.bar{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.srch{flex:1;min-width:180px;max-width:380px}
.clock{margin-left:auto;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.roles{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.roles button{border:0;background:var(--card);padding:6px 13px;cursor:pointer;font-weight:500;color:var(--mute);border-left:1px solid var(--line)}
.roles button:first-child{border:0}
.roles button[aria-pressed=true]{background:var(--pri);color:var(--on)}
main{padding:26px 28px 70px;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:24px;font-weight:700}
.sub{color:var(--mute);margin:3px 0 0}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.sec{margin-top:26px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:12px 16px}
.kpi b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:13px}
.kpi.w{border-left-color:#D98A00}.kpi.g{border-left-color:var(--ok)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--hov)}
.n{font-weight:600}
.id{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.meta{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.Pending{background:var(--warnbg);color:var(--warn)}.Scheduled{background:var(--infobg);color:var(--info)}.Completed{background:var(--okbg);color:var(--ok)}.Cancelled{background:var(--badbg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--pri);color:var(--on);border-color:var(--pri)}
.btn.p:hover{background:var(--prih)}
.btn.d{color:var(--bad)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-weight:500;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.bar input,.bar select{width:auto}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.empty{padding:34px;text-align:center;color:var(--mute)}
.gridt td,.gridt th{min-width:150px}
.gridt td:first-child,.gridt th:first-child{min-width:100px;color:var(--mute)}
.cell{border-radius:5px;padding:5px 8px;font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:center}
.free{color:var(--mute);opacity:.55}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:4px 0 12px}
.sbar i{display:block}
.leg div{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.log li:first-child{border:0}
.log time{color:var(--mute);width:44px;flex:none}
.cg{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.pb{position:sticky;top:70px}
.pb h2{font-size:18px;margin:0}
.pb dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.pb dt{color:var(--mute)}.pb dd{margin:0}
.hx{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:13px}
.hx div{padding:6px 0}
.rec{margin-bottom:12px;overflow:hidden}
.rh{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rx{margin-top:10px;border:1px solid var(--line);border-radius:6px}
.rx div{padding:8px 12px}.rx div+div{border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:1.4fr 1fr 2fr auto;gap:8px;margin-bottom:8px}
.err{color:var(--bad);font-size:13px;min-height:18px}
#modal{position:fixed;inset:0;background:#050d1888;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}
.dlg{background:var(--card);border-radius:10px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0004}
.dlg h3{font-size:18px;margin-bottom:12px}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:6px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.hl{display:none;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:14px;color:var(--ink)}
.hl svg{width:32px;height:32px;fill:none;stroke:none}
#pnav{display:none;gap:4px;flex-wrap:wrap}
#pnav button{border:0;background:none;padding:7px 13px;border-radius:6px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
#pnav button:hover{background:var(--hov)}
#pnav button[aria-current=page]{background:var(--infobg);color:var(--pri)}
.portal .app{grid-template-columns:1fr}
.portal aside,.portal .roles,.portal .clock{display:none}
.portal .hl,.portal #pnav{display:flex}
.portal main{margin:0 auto}
.avl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dc{padding:16px}
.dc .tp{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--infobg);color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border:0}
.steps li:before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.okbox{border-left:4px solid var(--ok);background:var(--okbg)}
.big{font-size:30px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
@media (max-width:700px){.avl{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{grid-row:auto;position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.sf{display:none}.logo{padding:0 10px 0 4px}.logo span{display:none}.bar{padding:10px 14px;position:static}main{padding:20px 14px 60px}.kpis{grid-template-columns:1fr 1fr}.two,.cg{grid-template-columns:1fr}.pb{position:static}.grid{grid-template-columns:1fr}.mrow{grid-template-columns:1fr 1fr}.clock{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside><div class="logo"><svg viewBox="0 0 32 32" role="img" aria-label="HealthBridge logo"><rect width="32" height="32" rx="8" fill="#1470D9"/><path d="M5 23c3-9 7-12 11-12s8 3 11 12M4 23h24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M16 14v7M12.5 17.5h7" fill="none" stroke="#9BE3FF" stroke-width="2.4" stroke-linecap="round"/></svg><span>HealthBridge</span></div><nav id="nav" style="display:contents" aria-label="Main"></nav><div class="sf">grp03_projectdb<br>PostgreSQL 17</div></aside>
<header class="bar"><div class="hl"><svg viewBox="0 0 32 32" role="img" aria-label="HealthBridge logo"><rect width="32" height="32" rx="8" fill="#1470D9"/><path d="M5 23c3-9 7-12 11-12s8 3 11 12M4 23h24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M16 14v7M12.5 17.5h7" fill="none" stroke="#9BE3FF" stroke-width="2.4" stroke-linecap="round"/></svg>HealthBridge</div><nav id="pnav" aria-label="Main"></nav><input class="srch" id="q" type="search" placeholder="Search patients by name or ID" aria-label="Search patients"><div id="who" class="acts"></div><div class="roles" id="roles" role="group" aria-label="View as"></div><div class="clock" id="clock"></div></header>
<main id="main"></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script>
const SLOTS=['08:00–09:00','09:00–10:00','10:00–11:00','11:00–12:00','13:00–14:00','14:00–15:00','15:00–16:00','16:00–17:00'];
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const T=day(0),dt=d=>new Date(d+'T00:00');
const fmt=d=>dt(d).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE='client';
const seed=()=>({
 sp:[{id:1,name:'General Practice'},{id:2,name:'Pediatrics'},{id:3,name:'Cardiology'},{id:4,name:'Dermatology'}],
 dr:[{id:1,sp:1,fn:'Maria',ln:'Santos',em:'m.santos@healthbridge.ph',on:1},{id:2,sp:2,fn:'Paolo',ln:'Reyes',em:'p.reyes@healthbridge.ph',on:1},{id:3,sp:3,fn:'Ana',ln:'Villanueva',em:'a.villanueva@healthbridge.ph',on:1}],
 pt:[{id:1,fn:'Juan',ln:'dela Cruz',ph:'0917 555 0142',ad:'San Pedro, Laguna'},{id:2,fn:'Liza',ln:'Mendoza',ph:'0928 555 0187',ad:'Biñan, Laguna'},{id:3,fn:'Carlo',ln:'Bautista',ph:'0935 555 0120',ad:'Cabuyao, Laguna'}],
 ap:[{id:1,pt:1,dr:1,date:T,slot:SLOTS[1],st:'Scheduled',sym:'Fever and sore throat for two days'},{id:2,pt:2,dr:1,date:T,slot:SLOTS[3],st:'Scheduled',sym:'Follow-up on blood pressure'},{id:3,pt:3,dr:null,date:day(1),slot:null,st:'Pending',sym:'Persistent dry cough, worse at night'},{id:4,pt:2,dr:null,date:day(2),slot:null,st:'Pending',sym:'Skin rash on both arms'},{id:5,pt:1,dr:1,date:day(-14),slot:SLOTS[0],st:'Completed',sym:'Persistent headache'}],
 nt:[{id:1,ap:5,dx:'Tension-type headache',ob:'BP 118/76. No neurological findings. Advised hydration and sleep.'}],
 rx:[{id:1,ap:5,med:'Paracetamol',dose:'500 mg',ins:'Take every 6 hours as needed, after meals'}]
});
const KEY='healthbridge_demo_v1';
let DB,nid=100;
const S={role:'staff',view:'req',did:1,cid:0,sd:T,q:'',me:0,done:null,fd:day(1),fs:0,log:[]};
const L0=()=>[{t:'08:05',m:'Dr. Maria Santos added to General Practice'},{t:'08:12',m:'Carlo Bautista submitted a request'}];
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.DB){DB=j.DB;nid=j.nid;S.log=j.log;return}}catch(e){}DB=seed();nid=100;S.log=L0()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({DB,nid,log:S.log.slice(0,40)}))}catch(e){}}
const NAV={admin:[['ov','Overview'],['docs','Doctors'],['spec','Specialties'],['pts','Patients']],staff:[['req','Requests'],['sched','Schedule'],['pts','Patients'],['docs','Doctors'],['spec','Specialties']],doctor:[['queue','My queue']],patient:[['visit','Request a visit'],['avail','Available doctors'],['mine','My appointment']]};
const ROLES={client:[],staff:[['staff','Staff'],['doctor','Doctor']],admin:[['patient','Patient'],['doctor','Doctor'],['staff','Staff'],['admin','Admin']]}[MODE];
const START={client:{role:'patient',view:'visit'},staff:{role:'staff',view:'req'},admin:{role:'admin',view:'ov'}}[MODE];
const IC={ov:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',docs:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',spec:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',pts:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 010 7M18 14c2.5.8 4 2.5 4 6"/>',req:'<path d="M5 5h14l2 8v6H3v-6z"/><path d="M3 13h5l1 3h6l1-3h5"/>',sched:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',queue:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',book:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',rec:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>'};
const $=s=>document.querySelector(s);
const P=id=>DB.pt.find(x=>x.id==id),D=id=>DB.dr.find(x=>x.id==id),SP=id=>DB.sp.find(x=>x.id==id),AP=id=>DB.ap.find(x=>x.id==id);
const mrn=id=>'HB-'+String(id).padStart(5,'0');
const pn=id=>{const p=P(id);return p?p.fn+' '+p.ln:'—'};
const dn=id=>{const d=D(id);return d?'Dr. '+d.fn+' '+d.ln:'Unassigned'};
const pc=id=>`<div class="n">${esc(pn(id))}</div><div class="id">${mrn(id)}</div>`;
const taken=(dr,date,slot,skip)=>DB.ap.some(a=>a.dr==dr&&a.date===date&&a.slot===slot&&a.st!=='Cancelled'&&a.id!==skip);
const pill=s=>`<span class="pill ${s}">${s}</span>`;
const L=m=>S.log.unshift({t:new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',hour12:false}),m});
const cmp=(a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot);
const activeDr=()=>DB.dr.filter(d=>d.on);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function modal(h){const m=$('#modal');m.innerHTML=h?`<div class="dlg">${h}</div>`:'';m.classList.toggle('on',!!h)}
const head=(t,s,x='')=>`<div class="head"><div><h1>${t}</h1><p class="sub">${s}</p></div>${x}</div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const tbl=(h,rows,msg)=>rows.length?`<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="panel">${empty(msg)}</div>`;
const kpi=(n,l,c='')=>`<div class="kpi ${c}"><b>${n}</b><span>${l}</span></div>`;

function chrome(){
 const cur=S.view==='consult'?'queue':S.view,nav=NAV[S.role],ic=k=>IC[k]||IC[{visit:'book',avail:'docs',mine:'rec'}[k]];
 $('#roles').innerHTML=ROLES.map(([k,l])=>`<button data-a="role" data-k="${k}" aria-pressed="${S.role===k}">${l}</button>`).join('');
 $('#who').innerHTML=S.role==='doctor'?`<select aria-label="Doctor" data-a="pick" data-t="did">${activeDr().map(d=>`<option value="${d.id}" ${d.id==S.did?'selected':''}>${esc(dn(d.id))}</option>`).join('')}</select>`:'';
 $('#nav').innerHTML=nav.map(([k,l])=>`<button data-a="view" data-k="${k}" ${cur===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ic(k)}</svg>${l}</button>`).join('');
 $('#pnav').innerHTML=nav.map(([k,l])=>`<button data-a="view" data-k="${k}" ${cur===k?'aria-current="page"':''}>${l}</button>`).join('');
 $('#q').style.display=['admin','staff'].includes(S.role)?'':'none';
}
const V={
ov(){
 const c=s=>DB.ap.filter(a=>a.st===s).length,n=DB.ap.length||1,col={Pending:'#D98A00',Scheduled:'#0B5CAD',Completed:'#17803D',Cancelled:'#B42318'};
